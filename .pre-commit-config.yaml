repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend Test & Pint
        entry: bash -c "composer install --no-interaction && vendor/bin/pint && php artisan test --testsuite=Feature"
        language: system
        types: [php]
        pass_filenames: false
      - id: frontend-lint
        name: Frontend Lint & Test
        entry: bash -c "cd frontend && npm install && npm run lint && npm run test"
        language: system
        types: [ts, tsx, js]
        pass_filenames: false
